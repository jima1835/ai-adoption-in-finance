[project]
name = "ai-adoption-in-finance"
version = "1.1.0"
description = "Self-updating intelligence feed tracking AI adoption across financial services."
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "requests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: exercises the real GDELT API over the network (deselected by default; run with -m live)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
