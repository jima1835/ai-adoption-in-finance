<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>institutions.json — review</title>
<style>
  :root {
    --bg:#0b0e12; --panel:#12161c; --panel2:#171c24; --line:#232a35;
    --text:#d7dde6; --dim:#8b96a5; --accent:#5eead4; --amber:#fbbf24;
    --red:#f87171; --blue:#60a5fa; --green:#4ade80; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.55 var(--mono); padding:20px; }
  a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:baseline; margin-bottom:6px; }
  h1 { font-size:20px; color:var(--accent); }
  .counts { color:var(--dim); font-size:14px; }
  .banner { color:var(--amber); font-size:14px; margin:4px 0 14px;
            border-left:3px solid var(--amber); padding-left:8px; }
  #toast { position:fixed; top:12px; right:12px; background:#7f1d1d; color:#fecaca;
           padding:8px 14px; border-radius:6px; display:none; z-index:9; max-width:46ch; }
  #commit { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:10px 14px; margin-bottom:18px; font-size:14px; display:none; }
  #commit code { color:var(--green); user-select:all; word-break:break-all; }
  #commit button { margin-left:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .card.dirty { border-color:var(--amber); }
  .rowhead { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; }
  .rowhead b { font-size:19px; }
  .tag { font-size:13px; padding:2px 9px; border-radius:10px; border:1px solid var(--line);
         color:var(--dim); }
  .tag.stage-scaling { color:var(--amber); border-color:var(--amber); }
  .tag.stage-piloting { color:var(--blue); border-color:var(--blue); }
  .tag.stage-exploring { color:var(--dim); }
  .tag.stage-embedded { color:var(--green); border-color:var(--green); }
  .tag.pause { color:var(--red); border-color:var(--red); }
  .tag.fresh { color:var(--green); border-color:var(--green); }
  select, input[type=text], textarea {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; font:14px var(--mono); padding:5px 8px; }
  textarea { width:100%; resize:vertical; }
  label { color:var(--dim); font-size:13px; display:block; margin:10px 0 3px; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
  @media (max-width:1000px){ .grid { grid-template-columns:1fr; } }
  .evidence { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
              padding:12px 14px; font-size:14px; max-height:560px; overflow:auto;
              white-space:pre-wrap; word-break:break-word; }
  .evidence .h { color:var(--accent); font-weight:bold; }
  .evitem { display:flex; gap:6px; margin-bottom:5px; align-items:center; }
  .evitem input { font-size:13px; }
  .evitem .ev-date { width:13ch; }
  .evitem .ev-desc { flex:2; min-width:120px; }
  .evitem .ev-url { flex:1; min-width:90px; }
  .evitem a { font-size:15px; }
  .new-addev { display:flex; gap:6px; margin:5px 0; align-items:center; }
  .new-addev input, .new-addev select { font-size:13px; }
  .ne-hint { font-size:12px; opacity:0.75; margin-bottom:6px; }
  .evrow { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .evrow input { flex:1; min-width:80px; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
           border-radius:6px; font:14px var(--mono); padding:7px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.approve { color:var(--green); border-color:var(--green); }
  button.pull { color:var(--red); }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .note { color:var(--dim); font-size:13px; }
  .decision { margin:10px 0 4px; }
  .case { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .casehead { font-size:13px; font-weight:bold; letter-spacing:.02em; margin-bottom:4px; }
  .casehead.ok-head { color:var(--green); } .casehead.hold-head { color:var(--red); }
  .case label { margin-top:8px; }
  .preview { max-height:300px; font-size:13px; }
  .diff-add { color:var(--green); }
  .diff-del { color:var(--red); text-decoration:line-through; opacity:.8; }
  mark { background:rgba(251,191,36,.18); color:inherit; border-radius:3px; padding:0 2px; }
  .verdict { font-size:13px; margin-top:8px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); }
  .verdict.ok { color:var(--green); border-color:var(--green); }
  .verdict.bad { color:var(--amber); border-color:var(--amber); }
  .agentrec { border-left:3px solid var(--accent); padding-left:8px; margin:6px 0; color:var(--text); }
  .voices { font-size:13px; color:var(--text); margin:4px 0 6px; }
  ol.tl { list-style:none; padding:0; margin:0; white-space:normal; }
  ol.tl li { padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
  ol.tl li:first-child { border-top:none; }
  .tl-date { color:var(--accent); font-weight:bold; margin-right:8px; }
  .tl-pub { color:var(--text); margin-right:6px; }
  .tl-ev { margin:2px 0; }
  .tag.own { color:var(--amber); border-color:var(--amber); }
  .tag.medium { color:var(--dim); }
  .subhead { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-top:12px; }
  details.more { margin-top:12px; border-top:1px dashed var(--line); padding-top:6px; }
  details.more summary { cursor:pointer; color:var(--dim); font-size:13px; }
  details.more[open] summary { margin-bottom:6px; }
  .holdnote { border-left:3px solid var(--amber); padding-left:8px; margin-top:8px; color:var(--text); }
  #done { margin-top:26px; color:var(--dim); font-size:14px; }
  #done li { margin-bottom:2px; }
</style>
</head>
<body>
<header><h1>institutions.json — review</h1><span class="counts" id="counts"></span></header>
<div class="banner">METHODOLOGY §4: plans are not stages · between two stages, pick the LOWER · unverifiable firm claims stay "(company claim)"</div>
<div class="banner" id="freeze-notice" style="display:none"></div>
<div id="commit"></div>
<div id="toast"></div>
<div id="changes"></div>
<div id="new-candidates"></div>
<div id="cards"></div>
<div id="nc"></div>
<div id="done"></div>

<script>
'use strict';
const STAGES = ['exploring','piloting','scaling','embedded'];
const CONFS = ['high','med','low'];
const TYPES = ['asset-manager','pension','sovereign-wealth','hedge-fund','endowment'];
const REGIONS = ['US','Canada','Europe','Middle East','Asia','Other'];
const OUTCOMES = ['no-qualifying-evidence','withdrawn-on-review'];
const ORDER = { scaling:0, embedded:1, piloting:2, exploring:3 };
let S = null;                       // server state
const approvedThisSession = [];     // {name,type} for the commit helper
const ncFiledThisSession = [];      // names filed to the public appendix
const transitionsThisSession = []; // names whose stage moved this sweep
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 6000);
}

/* advisory, not a gate: amber rule, never red — it does not stop you */
const WARNBOX_CSS = `.warnbox{border-left:3px solid #c98a12;padding-left:10px}
.warnbox ul{margin:6px 0 6px 18px;padding:0}.warnbox li{margin:2px 0}`;
(function(){ const st = document.createElement('style'); st.textContent = WARNBOX_CSS;
  document.head.appendChild(st); })();

function renderEvidence(text){
  if (!text) return '<span class="note">No REVIEW.md section found — baseline row or evidence lives elsewhere. Confirm against the row’s own event links.</span>';
  let h = esc(text);
  h = h.replace(/(https?:\/\/[^\s|<)"]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
  h = h.replace(/^(#{2,3} .*)$/gm, '<span class="h">$1</span>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return h;
}

function card(row){
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.name = row.name;
  const pauseTag = row.type === 'endowment'
    ? '<span class="tag pause">ENDOWMENT PAUSED — decide keep or pull</span>' : '';
  // Only never-reviewed rows are carded here. A reviewed row comes back for a
  // ruling solely through the SWEEP PROPOSALS panel, when a news pass staged one.
  const dueTag = '<span class="tag fresh">new</span>';
  d.innerHTML = `
    <div class="rowhead">
      <b>${esc(row.name)}</b>
      ${dueTag}
      <span class="tag">${esc(row.type)}</span>
      <span class="tag">${esc(row.aum || 'AUM —')}</span>
      <span class="tag stage-${esc(row.stage)}">proposed: ${esc(row.stage)}</span>
      <span class="tag">conf: ${esc(row.confidence || '—')}</span>
      ${pauseTag}
    </div>
    <div class="grid">
      <div>
        <label>stage</label><select class="f-stage">${STAGES.map(s =>
          `<option ${s===row.stage?'selected':''}>${s}</option>`).join('')}</select>
        <select class="f-conf" title="confidence">${CONFS.map(c =>
          `<option ${c===(row.confidence||'med')?'selected':''}>${c}</option>`).join('')}</select>
        <input type="text" class="f-aum" title="AUM" placeholder="~$92B" style="width:9ch">
        <label>rationale <span class="note">(changing the stage requires touching this — the "stops short of…" clause must match)</span></label>
        <textarea class="f-rationale" rows="6"></textarea>
        <label>footnote (scope calls)</label>
        <textarea class="f-footnote" rows="2"></textarea>
        <label>events <span class="note">(all editable — fix broken links here, ↗ tests the URL, × removes; min 2 per row)</span></label>
        <div class="events"></div>
        <div class="evrow">
          <input type="text" class="e-date" placeholder="date (verbatim precision: 2023 / 2026-03 / 2026-03-24)">
          <input type="text" class="e-desc" placeholder="one-line event">
          <input type="text" class="e-url" placeholder="source_url">
          <button class="addev">+ event</button>
        </div>
        <div class="actions">
          <button class="approve">Approve → as_of_reviewed = ${esc(S.today)}</button>
          <button class="pull">Pull row…</button>
          <input type="text" class="pull-reason" placeholder="reason → REJECTED.md" style="display:none;flex:1">
          <button class="pull-go" style="display:none">confirm pull</button>
        </div>
      </div>
      <div><label>evidence — local/REVIEW.md</label>
        <div class="evidence">${renderEvidence(S.sections[row.name])}</div></div>
    </div>`;
  // set text via value (no HTML-escaping pitfalls in textareas)
  d.querySelector('.f-rationale').value = row.rationale || '';
  d.querySelector('.f-footnote').value = row.footnote || '';
  d.querySelector('.f-aum').value = row.aum || '';
  const markDirty = () => d.classList.add('dirty');
  const evWrap = d.querySelector('.events');
  const addEventRow = (e) => {
    const r = document.createElement('div');
    r.className = 'evitem';
    r.innerHTML = `<input type="text" class="ev-date" title="date — verbatim precision">
      <input type="text" class="ev-desc" title="event">
      <input type="text" class="ev-url" title="source_url">
      <a class="ev-test" target="_blank" rel="noreferrer" title="open link">↗</a>
      <button class="ev-up" title="move up">↑</button>
      <button class="ev-down" title="move down">↓</button>
      <button class="ev-del" title="remove event">×</button>`;
    r.querySelector('.ev-date').value = e.date || '';
    r.querySelector('.ev-desc').value = e.event || '';
    const urlIn = r.querySelector('.ev-url');
    urlIn.value = e.source_url || '';
    const test = r.querySelector('.ev-test');
    const syncLink = () => { test.href = urlIn.value || '#'; };
    syncLink();
    urlIn.addEventListener('input', syncLink);
    r.querySelector('.ev-up').onclick = () => {
      const prev = r.previousElementSibling;
      if (prev) { evWrap.insertBefore(r, prev); markDirty(); }
    };
    r.querySelector('.ev-down').onclick = () => {
      const next = r.nextElementSibling;
      if (next) { evWrap.insertBefore(next, r); markDirty(); }
    };
    r.querySelector('.ev-del').onclick = () => { r.remove(); markDirty(); };
    r.querySelectorAll('input').forEach(el => el.addEventListener('input', markDirty));
    evWrap.appendChild(r);
  };
  (row.events || []).forEach(addEventRow);
  const collectEvents = () => [...d.querySelectorAll('.evitem')].map(r => ({
    date: r.querySelector('.ev-date').value.trim(),
    event: r.querySelector('.ev-desc').value.trim(),
    source_url: r.querySelector('.ev-url').value.trim(),
  }));
  d.querySelectorAll('select,textarea,input').forEach(el => el.addEventListener('input', markDirty));
  d.querySelector('.addev').onclick = () => {
    const date = d.querySelector('.e-date').value.trim();
    const desc = d.querySelector('.e-desc').value.trim();
    const url = d.querySelector('.e-url').value.trim();
    if (!date || !desc || !/^https?:\/\//.test(url))
      return toast('event needs date, description, and an http(s) source_url');
    addEventRow({ date, event: desc, source_url: url });
    ['e-date','e-desc','e-url'].forEach(c => d.querySelector('.'+c).value = '');
    markDirty();
  };
  d.querySelector('.pull').onclick = () => {
    d.querySelector('.pull-reason').style.display = 'inline-block';
    d.querySelector('.pull-go').style.display = 'inline-block';
  };
  d.querySelector('.pull-go').onclick = () =>
    apply({ action:'pull', name: row.name,
            reason: d.querySelector('.pull-reason').value.trim() || 'pulled in human review' });
  d.querySelector('.approve').onclick = () => {
    const stage = d.querySelector('.f-stage').value;
    const rationale = d.querySelector('.f-rationale').value;
    if (stage !== row.stage && rationale === (row.rationale || ''))
      return toast(`stage changed ${row.stage} → ${stage}: edit the rationale so its "stops short of…" clause matches, then approve.`);
    const evs = collectEvents();
    if (evs.length < 2)
      return toast('METHODOLOGY minimum is 2 events per row — add evidence or Pull the row instead.');
    if (evs.some(e => !e.date || !e.event || !/^https?:\/\//.test(e.source_url)))
      return toast('every event needs a date, a description, and an http(s) source_url.');
    apply({ action:'approve', name: row.name, fields: {
      stage, confidence: d.querySelector('.f-conf').value,
      rationale, footnote: d.querySelector('.f-footnote').value,
      aum: d.querySelector('.f-aum').value.trim(),
      events: evs,
    }});
  };
  return d;
}

// --- Decision preview for a sweep proposal -----------------------------------
// The card shows what each button leaves on the row, so a confidence correction is
// judged against both outcomes rather than against the agent's prose alone. The two
// regexes are the ones local/prefreeze_check.sh step 1 runs, so the verdict shown
// here is the check's verdict, not an approximation of it.
const CONF_RE = /[Cc]onfidence (?:is |would be |remains |is held at |held at |stays at |at )?(?:at )?(high|med|medium|low)\b/;
const SINGLE_VOICE_RE = /single[- ]voice|one voice|one publisher|single publisher/i;

// Sentence split that leaves "SOURCES.md" and "U.S." alone: a period ends a
// sentence only when whitespace or the end follows; 。 always does.
function splitSentences(text){
  const parts = String(text || '').split(/([.!?]+["\u201d\u2019)\]]*(?=\s|$)|\u3002+[\u300d\u300f\u201d]*)/);
  const out = [];
  for (let i = 0; i < parts.length; i += 2){
    const s = (parts[i] + (parts[i+1] || '')).trim();
    if (s) out.push(s);
  }
  return out;
}

// Sentence-level LCS diff — which sentences change is what the reviewer needs.
function sentenceDiff(before, after){
  const a = splitSentences(before), b = splitSentences(after);
  const n = a.length, m = b.length;
  const L = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m){
    if (a[i] === b[j]) { out.push({op:'same', s:a[i]}); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) { out.push({op:'del', s:a[i]}); i++; }
    else { out.push({op:'add', s:b[j]}); j++; }
  }
  while (i < n) out.push({op:'del', s:a[i++]});
  while (j < m) out.push({op:'add', s:b[j++]});
  return out;
}

// The sentence that states the confidence gets <mark>, so the eye lands on it.
function markConfidence(text){
  return splitSentences(text).map(s => CONF_RE.test(s) ? `<mark>${esc(s)}</mark>` : esc(s)).join(' ');
}

function renderDiff(before, after){
  if ((before || '') === (after || '')) return markConfidence(before);
  return sentenceDiff(before, after).map(d =>
    d.op === 'same' ? markConfidence(d.s)
    : d.op === 'add' ? `<span class="diff-add">${markConfidence(d.s)}</span>`
    : `<span class="diff-del">${esc(d.s)}</span>`).join(' ');
}

// Does the text's own statement of confidence agree with the field it would carry?
function confidenceVerdict(rationale, footnote, field){
  const txt = (rationale || '') + ' ' + (footnote || '');
  const m = CONF_RE.exec(txt);
  const said = m ? m[1].replace('medium', 'med') : null;
  const problems = [];
  if (said && said !== field) problems.push(`text says <b>${esc(said)}</b>, field would be <b>${esc(field)}</b>`);
  if (field === 'high' && SINGLE_VOICE_RE.test(txt)) problems.push('field <b>high</b> on a row whose own text says single voice');
  if (problems.length)
    return `<div class="verdict bad">\u2717 ${problems.join(' \u00b7 ')} \u2014 pre-freeze check step 1 trips</div>`;
  return `<div class="verdict ok">\u2713 ${said ? `text says ${esc(said)}, field ${esc(field)}` : `text states no confidence; field ${esc(field)}`} \u2014 consistent</div>`;
}

// The agent sometimes writes the hold-case wording into its reason after an
// "IF YOU … HOLD …:" marker. Surface it instead of leaving it buried in the prose.
function holdWording(reason){
  const m = /IF YOU[^:]*HOLD[^:]*:\s*([\s\S]+)$/i.exec(reason || '');
  return m ? m[1].trim() : '';
}

// --- Sources and dates, labelled the way the dashboard labels them ------------
// Ports publisherFor() and dateSortKey() from src/data.js: path rules first, then
// the host table walked up one label at a time; an unknown host answers with its
// bare hostname. "own voice" = the row's homepage domain or a `firm` medium.
const MEDIUM_LABELS = { firm:'firm site', vendor:'vendor', press:null, wire:'wire',
                        transcript:'transcript', filing:'filing', podcast:'podcast' };
function dateSortKey(raw){
  const [y='0', m='0', d='0'] = String(raw || '').split('-');
  return Number(y)*10000 + Number(m)*100 + Number(d);
}
function publisherFor(url){
  let u; try { u = new URL(url); } catch { return null; }
  const P = S.publishers || {};
  const host = u.hostname.toLowerCase().replace(/^www\./, '');
  const rule = (P.rules || []).find(r => r && r.host === host && u.pathname.startsWith(r.path_prefix || ''));
  if (rule) return { name: rule.name || host, medium: rule.medium || null, host };
  for (let h = host; ;) {
    const hit = (P.publishers || {})[h];
    if (hit) return { name: hit.name || host, medium: hit.medium || null, host };
    const cut = h.indexOf('.');
    if (cut < 0 || !h.includes('.', cut + 1)) break;
    h = h.slice(cut + 1);
  }
  return { name: host, medium: null, host };
}
function ownVoice(url, rowName, pub){
  const hp = ((S.homepages || {})[rowName] || {}).url;
  if (hp) { try {
    const hh = new URL(hp).hostname.toLowerCase().replace(/^www\./, '');
    const eh = new URL(url).hostname.toLowerCase().replace(/^www\./, '');
    if (eh === hh || eh.endsWith('.' + hh)) return true;
  } catch {} }
  // A firm's own site, its wire-distributed release and its regulatory filing are
  // all the firm speaking (SOURCES.md §1 lists filings among own-voice disclosures).
  return !!(pub && ['firm', 'wire', 'filing'].includes(pub.medium));
}
function renderTimeline(row){
  const evs = [...(row.events || [])].sort((a,b) => dateSortKey(b.date) - dateSortKey(a.date));
  if (!evs.length) return '<span class="note">This row carries no dated events.</span>';
  const byPub = new Map(); let own = 0;
  const items = evs.map(e => {
    const p = publisherFor(e.source_url) || { name:'source', medium:null };
    const isOwn = ownVoice(e.source_url, row.name, p);
    if (isOwn) own++;
    byPub.set(p.name, (byPub.get(p.name) || 0) + 1);
    const med = p.medium && MEDIUM_LABELS[p.medium];
    return `<li><span class="tl-date">${esc(e.date || '')}</span><span class="tl-pub">${esc(p.name)}</span>${
        med ? `<span class="tag medium">${esc(med)}</span>` : ''}${isOwn ? ' <span class="tag own">own voice</span>' : ''}
      <div class="tl-ev">${esc(e.event || '')}</div>
      <a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(e.source_url)}</a></li>`;
  }).join('');
  const others = new Set();
  evs.forEach(e => { const p = publisherFor(e.source_url); if (p && !ownVoice(e.source_url, row.name, p)) others.add(p.name); });
  const summary = `${evs.length} event${evs.length===1?'':'s'} \u00b7 ${byPub.size} publisher${byPub.size===1?'':'s'}: ${
      [...byPub].map(([k,n]) => `${esc(k)}${n>1 ? ' \u00d7'+n : ''}`).join(', ')} \u00b7 ${own} own-voice (firm site, wire, filing) \u00b7 ${
      others.size} other publisher${others.size===1?'':'s'} \u2014 SOURCES.md \u00a71: one voice caps at med, two independent publishers lift to high`;
  return `<div class="voices">${summary}</div><ol class="tl">${items}</ol>`;
}
// Just the sentence(s) that state the confidence, for the compact as-is view.
function confidenceSentences(rationale, footnote){
  const out = [];
  [rationale, footnote].forEach(t => splitSentences(t).forEach(s => { if (CONF_RE.test(s)) out.push(s); }));
  return out;
}

// Intake dossier fallback for the evidence-ledger box: rows that entered through
// the new-institution path have no REVIEW.md section, and their quotes and tiers
// live in local/intake instead.
function renderDossier(dos){
  const items = (dos.evidence || []).map(e =>
    `<div><b>${esc(e.date || '')} \u00b7 ${esc(e.publisher || '')} \u00b7 ${esc(e.tier || '')}</b><br>
      <a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.url)}</a><br>
      ${esc(e.quote || '')}${e.note ? `<br><span class="note">${esc(e.note)}</span>` : ''}</div>`).join('<hr>');
  return (items || '<span class="note">dossier carries no evidence items</span>')
    + (dos.uncertainty ? `<hr><b>Uncertainty:</b> ${esc(dos.uncertainty)}` : '')
    + (dos.status ? `<hr><span class="note">intake status when filed: ${esc(dos.status)}</span>` : '');
}

// Monthly REFRESH sweep. Agents write proposals into local/CHANGES_QUEUE.json and
// never move a stage themselves. Approving here is the only path, and a stage move
// demands the date of the evidence that caused it — that date, not today's, is what
// data/transitions.jsonl records, so the panel measures the sector's calendar and
// not the reviewer's.
//
// The card carries the SAME editors as a first review — events, AUM, rationale,
// footnote — because a proposal that brings new evidence is worthless if the row's
// prose cannot be updated to cite it. Before this, a sweep approval could append
// events but left the rationale untouched, which is how a row ends up asserting
// facts no source_url on it supports.
//
// Two independent controls per proposed event, deliberately:
//   [x] include  — a CHECKBOX, so any subset (or all) of the proposed events can be
//                  taken. This used to be a radio group, which made it look like the
//                  reviewer was choosing events when in fact every event was appended
//                  regardless and the choice only set the transition date.
//   ( ) dates it — a RADIO, because a transition has exactly one effective date.
//                  Only an included event may hold it.
function changeCard(entry){
  const d = document.createElement('div');
  d.className = 'card';
  const row = (S.institutions || []).find(x => x.name === entry.name) || {};
  const moves = entry.proposed_stage && entry.proposed_stage !== entry.current_stage;
  const evs = (Array.isArray(entry.new_events) ? entry.new_events : [])
    .filter(e => e && (e.date || e.event || e.source_url));
  const agentConf = entry.proposed_confidence || entry.current_confidence;
  const agentStage = entry.proposed_stage || entry.current_stage;
  const agentRat = entry.proposed_rationale ?? row.rationale ?? '';
  const agentFoot = entry.proposed_footnote ?? row.footnote ?? '';
  const hold = holdWording(entry.reason);
  const hasHoldDraft = !!(entry.hold_rationale || entry.hold_footnote);
  const holdRat = entry.hold_rationale ?? row.rationale ?? '';
  const holdFoot = entry.hold_footnote ?? row.footnote ?? '';
  const dossier = (S.dossier_evidence || {})[entry.name];
  const ledger = S.sections[entry.name];
  d.innerHTML = `
    <div class="rowhead">
      <b>${esc(entry.name)}</b>
      <span class="tag">${moves
        ? `proposes ${esc(entry.current_stage)} → <b>${esc(entry.proposed_stage)}</b>`
        : `stage ${esc(entry.current_stage)}`} · confidence ${esc(entry.current_confidence)}${
        agentConf !== entry.current_confidence ? ` → <b>${esc(agentConf)}</b>` : ' (unchanged)'}</span>
      ${entry.correction ? '<span class="tag">correction — no transition</span>' : ''}
      <span class="note">${esc(entry.sweep || '')}</span>
    </div>
    <div><label>sources and dates on this row — as the dashboard shows them</label>
      <div class="evidence">${renderTimeline(row)}</div></div>
    <div><label>rationale — what Approve change writes <span class="c-prev-rat-note"></span></label>
      <div class="evidence preview c-prev-rationale"></div></div>
    <div class="c-prev-footnote-wrap"><label>footnote — what Approve change writes (green added, red struck)</label>
      <div class="evidence preview c-prev-footnote"></div></div>
    <div class="c-prev-fields"></div>
    <div class="c-prev-verdict"></div>
    <div class="evrow" style="margin-top:8px">
      <label>stage</label>
      <select class="c-stage">${STAGES.map(t =>
        `<option ${t===(entry.proposed_stage||entry.current_stage)?'selected':''}>${t}</option>`).join('')}</select>
      <label>confidence <span class="note">(agent: ${esc(agentConf)} · current: ${esc(entry.current_confidence)})</span></label>
      <select class="c-conf">${CONFS.map(t =>
        `<option ${t===agentConf?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div><label>edit the rationale — ${entry.proposed_rationale
        ? "pre-filled with the agent's proposed rewrite"
        : 'pre-filled with the current text (agent proposed no rewrite)'}</label>
      <textarea class="c-rationale" rows="7"></textarea></div>
    <div class="c-foot-edit"><label>footnote${entry.proposed_footnote ? " — pre-filled with the agent's proposed rewrite" : ''}</label>
      <textarea class="c-footnote" rows="4"></textarea></div>
    <div class="actions">
      <button class="approve c-approve">Approve change</button>
      <button class="pull c-reject">Hold row as-is</button>
      <button class="c-load-agent">Reset to the agent's proposal</button>
      ${hasHoldDraft ? `<button class="c-load-hold">Load the hold draft (field → ${esc(entry.current_confidence)})</button>` : ''}
    </div>
    <details class="more"><summary>more — agent's reason, hold-as-is preview, evidence ledger, proposed events, AUM, transition date</summary>
      <div class="note"><b>agent reason:</b> ${esc(entry.reason || '(none given)')}</div>
      ${entry.criterion ? `<div class="note"><b>criterion:</b> ${esc(entry.criterion)}</div>` : ''}
      ${(entry.citations || []).length ? `<div class="note"><b>the flag rests on:</b><ul>${
        (entry.citations || []).map(c => `<li><a href="${esc(c.url)}" target="_blank"
          rel="noreferrer">${esc(c.url)}</a>${c.check ? ' — ' + esc(c.check) : ''}</li>`).join('')
        }</ul></div>` : ''}
      <div class="subhead">hold row as-is leaves</div>
      <div class="note">confidence <b>${esc(entry.current_confidence)}</b>, stage ${esc(entry.current_stage)}; text and events untouched; only the reviewed date advances. The text's own statement of confidence:</div>
      <div class="evidence preview">${confidenceSentences(row.rationale, row.footnote).map(s => `<mark>${esc(s)}</mark>`).join('<br>')
          || '<span class="note">the text states no confidence</span>'}</div>
      ${confidenceVerdict(row.rationale, row.footnote, entry.current_confidence)}
      ${hasHoldDraft ? `
      <div class="subhead">hold the field, fix the text — agent draft</div>
      <div class="note">confidence stays <b>${esc(entry.current_confidence)}</b>; the confidence sentence is rewritten so text and field agree. Applied through <b>Approve change</b> with the field reset, so the log records the overrule.</div>
      ${entry.hold_ground ? `<div class="note holdnote"><b>what this hold rests on:</b> ${esc(entry.hold_ground)}</div>` : ''}
      ${entry.hold_rationale ? `<label>rationale under hold — green added, red struck</label>
        <div class="evidence preview">${renderDiff(row.rationale || '', holdRat)}</div>` : ''}
      ${entry.hold_footnote ? `<label>footnote under hold — green added, red struck</label>
        <div class="evidence preview">${renderDiff(row.footnote || '', holdFoot)}</div>` : ''}
      ${confidenceVerdict(holdRat, holdFoot, entry.current_confidence)}`
      : hold ? `<div class="note holdnote"><b>agent's wording if you keep the field:</b> ${esc(hold)}</div>` : ''}
      <div><label>evidence ledger — ${ledger ? 'local/REVIEW.md'
          : dossier ? `intake dossier ${esc(dossier.path)} (no REVIEW.md section — the row entered through intake)`
          : 'local/REVIEW.md'}</label>
        <div class="evidence">${ledger ? renderEvidence(ledger) : dossier ? renderDossier(dossier) : renderEvidence('')}</div></div>
      <div><label>proposed new events — tick the ones to add, pick the one that dates a stage move</label>
        <div class="cvents"></div>
        <div class="evrow">
          <input type="text" class="e-date" placeholder="YYYY-MM-DD" style="flex:0 0 13ch">
          <input type="text" class="e-desc" placeholder="event — what the source actually says" style="flex:2">
          <input type="text" class="e-url" placeholder="https://source" style="flex:1">
          <button class="addcv">add event</button>
          <button class="cv-all">tick all</button>
          <button class="cv-none">untick all</button>
        </div>
        <div class="note cv-count"></div>
      </div>
      <div class="evrow" style="margin-top:8px"><label>AUM</label><input type="text" class="c-aum" style="flex:0 0 16ch"></div>
      <div class="evrow c-daterow" style="margin-top:8px">
        <label>date_effective</label><input type="text" class="c-date" placeholder="YYYY-MM-DD" style="flex:0 0 14ch">
        <label>evidence_url</label><input type="text" class="c-url" style="flex:1" placeholder="https://…">
      </div>
      <div class="note c-datenote">required only when the stage actually moves — the date of the evidence, never today</div>
    </details>`;

  // Textareas/inputs set by value, never by innerHTML — no escaping pitfalls.
  d.querySelector('.c-aum').value = entry.proposed_aum ?? row.aum ?? '';
  d.querySelector('.c-rationale').value = agentRat;
  d.querySelector('.c-footnote').value = agentFoot;

  // The APPROVE column follows the editor: at load it is the agent's recommendation,
  // and it re-renders as the reviewer edits so the verdict is for what will be written.
  function syncPreview(){
    const conf = d.querySelector('.c-conf').value, stage = d.querySelector('.c-stage').value;
    const rat = d.querySelector('.c-rationale').value, foot = d.querySelector('.c-footnote').value;
    const isAgent = conf === agentConf && stage === agentStage && rat === agentRat && foot === agentFoot;
    d.querySelector('.c-prev-fields').innerHTML = `<div class="note"><b>Approve change writes:</b> confidence ${esc(entry.current_confidence)}${
        conf !== entry.current_confidence ? ` \u2192 <b>${esc(conf)}</b>` : ' (unchanged)'} \u00b7 stage ${esc(entry.current_stage)}${
        stage !== entry.current_stage ? ` \u2192 <b>${esc(stage)}</b>` : ' (unchanged)'} \u00b7 ${isAgent
        ? "= the agent's recommendation" : "edited by you \u2014 differs from the agent's recommendation"}</div>`;
    d.querySelector('.c-prev-rat-note').textContent = rat === (row.rationale || '')
      ? '\u2014 unchanged; only the field moves' : '\u2014 green added, red struck, against the current text';
    d.querySelector('.c-prev-rationale').innerHTML = renderDiff(row.rationale || '', rat) || '<span class="note">(empty)</span>';
    const fw = d.querySelector('.c-prev-footnote-wrap');
    if (foot !== (row.footnote || '')){ fw.hidden = false; d.querySelector('.c-prev-footnote').innerHTML = renderDiff(row.footnote || '', foot); }
    else fw.hidden = true;
    d.querySelector('.c-prev-verdict').innerHTML = confidenceVerdict(rat, foot, conf);
  }
  ['.c-conf', '.c-stage'].forEach(c => d.querySelector(c).addEventListener('change', syncPreview));
  ['.c-rationale', '.c-footnote'].forEach(c => d.querySelector(c).addEventListener('input', syncPreview));
  syncPreview();

  const footEdit = d.querySelector('.c-foot-edit'), more = d.querySelector('details.more');
  footEdit.hidden = !entry.proposed_footnote;
  more.addEventListener('toggle', () => { if (more.open) footEdit.hidden = false; });
  const loadEditor = (conf, stage, rat, foot) => {
    d.querySelector('.c-conf').value = conf; d.querySelector('.c-stage').value = stage;
    d.querySelector('.c-rationale').value = rat; d.querySelector('.c-footnote').value = foot;
    syncPreview(); d.classList.add('dirty');
  };
  d.querySelector('.c-load-agent').onclick = () => {
    loadEditor(agentConf, agentStage, agentRat, agentFoot);
    toast(`editor reset to the agent's proposal \u2014 confidence ${agentConf}`);
  };
  const loadHold = d.querySelector('.c-load-hold');
  if (loadHold) loadHold.onclick = () => {
    loadEditor(entry.current_confidence, entry.current_stage, holdRat, holdFoot);
    toast(`hold draft loaded \u2014 field stays ${entry.current_confidence}; click Approve change to write it`);
  };

  const wrap = d.querySelector('.cvents');
  const dateIn = d.querySelector('.c-date'), urlIn = d.querySelector('.c-url');
  // A correction re-reads evidence the row already carries; nothing happened in
  // the world, so there is no evidence date to give and no panel record to make.
  if (entry.correction) {
    d.querySelector('.c-daterow').style.display = 'none';
    d.querySelector('.c-datenote').textContent =
      'CORRECTION — re-reading of evidence already on the row, not a new event. '
      + 'No date_effective is asked for and nothing is appended to data/transitions.jsonl; '
      + 'the decision is logged in DECISIONS.jsonl.';
  }
  const countEl = d.querySelector('.cv-count');
  const effName = 'eff-' + Math.random().toString(36).slice(2);

  const addCvRow = (e, checked) => {
    const r = document.createElement('div');
    r.className = 'evitem cvitem';
    r.innerHTML = `<input type="checkbox" class="cv-inc" title="include this event">
      <input type="radio" name="${effName}" class="cv-eff" title="this event dates a stage move">
      <input type="text" class="ev-date" title="date — verbatim precision">
      <input type="text" class="ev-desc" title="event" style="flex:2">
      <input type="text" class="ev-url" title="source_url" style="flex:1">
      <a class="ev-test" target="_blank" rel="noreferrer" title="open link">↗</a>
      <button class="ev-del" title="remove from this proposal">×</button>`;
    r.querySelector('.cv-inc').checked = checked !== false;
    r.querySelector('.ev-date').value = e.date || '';
    r.querySelector('.ev-desc').value = e.event || '';
    const u = r.querySelector('.ev-url');
    u.value = e.source_url || '';
    const test = r.querySelector('.ev-test');
    const syncLink = () => { test.href = u.value || '#'; };
    syncLink();
    u.addEventListener('input', syncLink);
    r.querySelector('.ev-del').onclick = () => { r.remove(); refresh(); };
    r.querySelector('.cv-inc').onchange = refresh;
    r.querySelector('.cv-eff').onchange = syncEffective;
    r.querySelectorAll('input[type=text]').forEach(el => el.addEventListener('input', syncEffective));
    wrap.appendChild(r);
    return r;
  };

  // Included rows only may carry the transition radio; if the current holder is
  // unticked or deleted, the radio moves to the first row still included.
  function refresh(){
    const rows = [...wrap.querySelectorAll('.cvitem')];
    let held = null;
    rows.forEach(r => {
      const inc = r.querySelector('.cv-inc').checked;
      const eff = r.querySelector('.cv-eff');
      eff.disabled = !inc;
      if (!inc) eff.checked = false;
      if (eff.checked) held = r;
    });
    if (!held) {
      const first = rows.find(r => r.querySelector('.cv-inc').checked);
      if (first) first.querySelector('.cv-eff').checked = true;
    }
    const n = rows.filter(r => r.querySelector('.cv-inc').checked).length;
    countEl.textContent = rows.length
      ? `${n} of ${rows.length} proposed events will be added, on top of the ${(row.events || []).length} already on the row`
      : `no events proposed — add one above, or set the effective date by hand if you move the stage`;
    syncEffective();
  }

  // The server demands a full YYYY-MM-DD for a transition, but an event date is
  // kept at the precision its source supports and is often just "2025". Copying a
  // partial date into the box would hand the reviewer a value the server rejects,
  // so a partial date fills the URL only and says why the date is still blank.
  function syncEffective(){
    const held = [...wrap.querySelectorAll('.cvitem')]
      .find(r => r.querySelector('.cv-eff').checked && r.querySelector('.cv-inc').checked);
    if (!held) return;
    const dv = held.querySelector('.ev-date').value.trim();
    urlIn.value = held.querySelector('.ev-url').value.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(dv)) {
      dateIn.value = dv;
      dateIn.placeholder = 'YYYY-MM-DD';
    } else {
      dateIn.value = '';
      dateIn.placeholder = dv ? `${dv} — needs a full date` : 'YYYY-MM-DD';
    }
  }

  evs.forEach(e => addCvRow(e, true));
  refresh();

  d.querySelector('.addcv').onclick = () => {
    const date = d.querySelector('.e-date').value.trim();
    const desc = d.querySelector('.e-desc').value.trim();
    const url = d.querySelector('.e-url').value.trim();
    if (!date || !desc || !/^https?:\/\//.test(url))
      return toast('event needs date, description, and an http(s) source_url');
    addCvRow({ date, event: desc, source_url: url }, true);
    ['e-date','e-desc','e-url'].forEach(c => d.querySelector('.'+c).value = '');
    refresh();
  };
  d.querySelector('.cv-all').onclick = () => {
    wrap.querySelectorAll('.cv-inc').forEach(c => c.checked = true); refresh();
  };
  d.querySelector('.cv-none').onclick = () => {
    wrap.querySelectorAll('.cv-inc').forEach(c => c.checked = false); refresh();
  };

  const included = () => [...wrap.querySelectorAll('.cvitem')]
    .filter(r => r.querySelector('.cv-inc').checked)
    .map(r => ({ date: r.querySelector('.ev-date').value.trim(),
                 event: r.querySelector('.ev-desc').value.trim(),
                 source_url: r.querySelector('.ev-url').value.trim() }));

  d.querySelector('.c-approve').onclick = () => {
    const stage = d.querySelector('.c-stage').value;
    const rationale = d.querySelector('.c-rationale').value;
    const picked = included();
    if (picked.some(e => !e.date || !e.event || !/^https?:\/\//.test(e.source_url)))
      return toast('every included event needs a date, a description, and an http(s) source_url.');
    // Same guard as a first review: a stage that moves without its rationale moving
    // leaves the row asserting a "stops short of…" clause for the stage it just left.
    if (stage !== entry.current_stage && rationale === (row.rationale || ''))
      return toast(`stage ${entry.current_stage} → ${stage}: edit the rationale so its "stops short of…" clause matches, then approve.`);
    const merged = (row.events || []).concat(picked)
      // De-duplicate on the whole event, not (date, url): one document can carry two
      // facts with one date (IMCO's 2025 annual report lost its second event this way
      // on 2026-09-26). Text is compared trimmed so a stray space is not a new event.
      .filter((e,i,a) => a.findIndex(x => x.date===e.date && x.source_url===e.source_url
                                           && (x.event||'').trim()===(e.event||'').trim()) === i);
    if (merged.length < 2)
      return toast('METHODOLOGY minimum is 2 events per row.');
    apply({ action:'ch_approve', name: entry.name,
            fields: { stage, confidence: d.querySelector('.c-conf').value,
                      aum: d.querySelector('.c-aum').value.trim(),
                      rationale, footnote: d.querySelector('.c-footnote').value,
                      events: merged },
            date_effective: dateIn.value.trim(), evidence_url: urlIn.value.trim() });
  };
  d.querySelector('.c-reject').onclick = () => {
    // A pure hold leaves the text as it stands. When that text states a different
    // confidence from the field, say so before the click lands (Korea Teachers, 2026-09-26).
    if (/verdict bad/.test(confidenceVerdict(row.rationale, row.footnote, entry.current_confidence))
        && !confirm(`Holding as-is leaves the row's own text disagreeing with its ${entry.current_confidence} field \u2014 pre-freeze check step 1 will trip on it.\n\nTo keep the field AND fix the sentence, use "Load the hold draft" (or edit the rationale) and Approve change instead.\n\nHold as-is anyway?`))
      return;
    const reason = prompt(`Hold ${entry.name} at ${entry.current_stage}. Why?`, '');
    if (reason === null) return;
    apply({ action:'ch_reject', name: entry.name, reason });
  };
  return d;
}

function renderChanges(){
  const el = document.getElementById('changes');
  el.innerHTML = '';
  const queue = S.changes_queue || [];
  if (!queue.length) return;
  const moves = queue.filter(e => e.proposed_stage && e.proposed_stage !== e.current_stage).length;
  const h = document.createElement('div');
  h.className = 'banner';
  h.textContent = `SWEEP PROPOSALS — ${queue.length} staged (${moves} would move a stage) · review these first`;
  el.appendChild(h);
  queue.forEach(e => el.appendChild(changeCard(e)));
}

// New institutions stay outside the public corpus until a human reviews their
// complete row. Publication is performed only by the human reviewer action.
function newCandidateCard(item){
  const row = item.row || {};
  const d = document.createElement('div');
  d.className = 'card';
  // One layout, one pair of buttons, every status. The intake status is shown as
  // a tag and its failed checks are listed below the buttons; none of it decides
  // for you. You reject on the criteria — the tool's job is to make sure nothing
  // that fails a check passes silently, not to argue with the click.
  const warnings = Array.isArray(item.warnings) ? item.warnings : [];
  const ready = item.status === 'ready';
  // Held on a RULE the reviewer owns, not on missing research: releasable by a
  // recorded judgment rather than by more searching.
  const held = item.status === 'tier_ruling' || item.status === 'evidence_gap';
  d.innerHTML = `
    <div class="rowhead"><b>${esc(row.name)}</b>
      <span class="tag">new ${esc(row.type || '')}</span>
      <span class="tag">${ready ? 'ready for human review' : esc(item.status || 'evidence gap')}</span>
      <span class="tag stage-${esc(row.stage)}">proposed: ${esc(row.stage)}</span></div>
    <div class="note">${esc(item.reason || '')}</div>
    <div class="grid"><div>
      <label>stage and confidence</label>
      <select class="new-stage">${STAGES.map(s => `<option ${s===row.stage?'selected':''}>${s}</option>`).join('')}</select>
      <select class="new-confidence">${CONFS.map(c => `<option ${c===row.confidence?'selected':''}>${c}</option>`).join('')}</select>
      <label>AUM</label><input class="new-aum" type="text" style="width:20ch">
      <label>rationale</label><textarea class="new-rationale" rows="6"></textarea>
      <label>footnote and scope calls</label><textarea class="new-footnote" rows="3"></textarea>
      <label>dated events</label><div class="new-events"></div>
      <div class="new-addev">
        <input class="ne-date" type="text" placeholder="YYYY-MM-DD" style="width:13ch">
        <input class="ne-desc" type="text" placeholder="what the source establishes" style="flex:2">
        <input class="ne-url" type="text" placeholder="https://source you opened" style="flex:1">
        <button class="ne-add">+ event</button>
      </div>
      <div class="new-addev">
        <input class="ne-pub" type="text" placeholder="publisher" style="flex:1">
        <select class="ne-tier"><option value="">tier…</option><option>T1</option><option>T2</option></select>
        <input class="ne-quote" type="text" placeholder="verbatim sentence that carries it" style="flex:2">
      </div>
      <div class="note ne-hint">A new event needs its own source. If the URL is not already in
        the dossier, fill publisher + tier + quote — T3 is not accepted, and the tier is your
        call to record.</div>
      <div class="actions">
        <button class="approve new-approve">Approve and add to corpus</button>
        <button class="pull new-reject">Reject candidate</button>
      </div>
      ${held ? `<div class="new-addev">
        <input class="nr-ruling" type="text" style="flex:2"
          placeholder="Your ruling \u2014 which source or limitation you admit, and why">
        <button class="nr-go">Record ruling &amp; release</button>
      </div>
      <div class="note">Held on a rule, not on missing research. Recording your ruling moves this
        to <code>ready</code> and logs it to DECISIONS.jsonl. It does not publish, and the row bar
        still applies when you approve.</div>` : ''}
      <div class="new-addev">
        <select class="na-outcome">
          <option value="no-qualifying-evidence">no-qualifying-evidence</option>
          <option value="withdrawn-on-review">withdrawn-on-review</option>
        </select>
        <button class="na-file">File to appendix →</button>
      </div>
      <textarea class="na-reason" rows="3" placeholder="PUBLIC reason — publishes verbatim in data/not_classified.json, so it must stand alone. No intake jargon, no &quot;evidence_gap&quot;, no reference to this queue."></textarea>
      <div class="note">Not a dashboard row, but a real finding? File it. This stages a DRAFT
        in the not-classified queue — you still file it to the public appendix below, and you
        still own the wording. Unlike Reject, it keeps the research.</div>
      ${warnings.length ? `<div class="note warnbox"><b>Checks this candidate does not pass
        (${warnings.length}) — your call:</b><ul>${warnings.map(w =>
        `<li>${esc(w)}</li>`).join('')}</ul>Approving records these in DECISIONS.jsonl.
        Rejecting deletes the research.</div>`
        : '<div class="note">Every check passes. Rejecting deletes the research.</div>'}
    </div><div>
      <label>source dossier — open and verify every URL</label>
      <div class="evidence">${(item.evidence || []).map(e =>
        `<div><b>${esc(e.date || '')} · ${esc(e.publisher || '')} · ${esc(e.tier || '')}</b><br>
        <a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.url)}</a><br>
        ${esc(e.quote || '')}${e.translation ? `<br>${esc(e.translation)}` : ''}</div>`).join('<hr>')}
        ${item.uncertainty ? `<hr><b>Uncertainty:</b> ${esc(item.uncertainty)}` : ''}</div>
    </div></div>`;
  d.querySelector('.new-aum').value = row.aum || '';
  d.querySelector('.new-rationale').value = row.rationale || '';
  d.querySelector('.new-footnote').value = row.footnote || '';
  const wrap = d.querySelector('.new-events');
  const addEvRow = (e) => {
    const line = document.createElement('div');
    line.className = 'evitem';
    line.innerHTML = `<input class="ev-date" title="date" style="width:13ch">
      <input class="ev-desc" title="event" style="flex:2">
      <input class="ev-url" title="source URL" style="flex:1">
      <a class="ev-test" target="_blank" rel="noreferrer">↗</a>
      <button class="ev-up" title="move up">↑</button>
      <button class="ev-down" title="move down">↓</button>
      <button class="ev-del" title="remove event">×</button>`;
    line.querySelector('.ev-date').value = e.date || '';
    line.querySelector('.ev-desc').value = e.event || '';
    line.querySelector('.ev-url').value = e.source_url || '';
    line.querySelector('.ev-test').href = e.source_url || '#';
    line.querySelector('.ev-url').oninput = ev =>
      line.querySelector('.ev-test').href = ev.target.value || '#';
    line.querySelector('.ev-up').onclick = () => {
      const prev = line.previousElementSibling;
      if (prev) wrap.insertBefore(line, prev);
    };
    line.querySelector('.ev-down').onclick = () => {
      const next = line.nextElementSibling;
      if (next) wrap.insertBefore(next, line);
    };
    line.querySelector('.ev-del').onclick = () => line.remove();
    wrap.appendChild(line);
  };
  (row.events || []).forEach(addEvRow);

  // Sources the reviewer registers in this session, sent with the approval so
  // the server can accept events citing a URL the agent never found.
  const reviewerSources = [];
  d.querySelector('.ne-add').onclick = () => {
    const g = (c) => d.querySelector('.' + c).value.trim();
    const [dt, desc, url] = [g('ne-date'), g('ne-desc'), g('ne-url')];
    if (!dt || !desc || !/^https:\/\//.test(url))
      return toast('an event needs a date, a description, and an https source URL');
    const known = (item.evidence || []).some(e => e.url === url)
      || reviewerSources.some(e => e.url === url);
    if (!known) {
      const [pub, tier, quote] = [g('ne-pub'), d.querySelector('.ne-tier').value, g('ne-quote')];
      if (!pub || !tier || !quote)
        toast('noted without publisher/tier/quote — it will show as an unbacked event');
      reviewerSources.push({ date: dt, publisher: pub, tier, url, quote });
    }
    addEvRow({ date: dt, event: desc, source_url: url });
    ['ne-date','ne-desc','ne-url','ne-pub','ne-quote'].forEach(c => d.querySelector('.'+c).value='');
    d.querySelector('.ne-tier').value = '';
    toast('event added — it publishes only when you approve');
  };
  d.querySelector('.new-approve').onclick = () => apply({
    action:'new_approve', name:row.name,
    fields:{stage:d.querySelector('.new-stage').value,
      confidence:d.querySelector('.new-confidence').value,
      aum:d.querySelector('.new-aum').value.trim(),
      rationale:d.querySelector('.new-rationale').value,
      footnote:d.querySelector('.new-footnote').value,
      events:[...wrap.querySelectorAll('.evitem')].map(r => ({
        date:r.querySelector('.ev-date').value.trim(),
        event:r.querySelector('.ev-desc').value.trim(),
        source_url:r.querySelector('.ev-url').value.trim()}))},
    evidence_added: reviewerSources});
  d.querySelector('.new-reject').onclick = () => {
    const reason = prompt(`Why reject ${row.name}?`, '');
    if (reason !== null) apply({action:'new_reject', name:row.name, reason});
  };
  if (d.querySelector('.nr-go')) d.querySelector('.nr-go').onclick = () => {
    const ruling = d.querySelector('.nr-ruling').value.trim();
    if (ruling.length < 25){
      toast('state the ruling \u2014 it is logged as the basis for the row'); return;
    }
    apply({action:'new_ruling', name:row.name, ruling});
  };
  d.querySelector('.na-file').onclick = () => {
    // The agent's `reason` is intake-internal prose; the appendix publishes verbatim.
    // So the public wording is typed here, never inherited.
    const reason = d.querySelector('.na-reason').value.trim();
    if (reason.length < 40){
      toast('write the PUBLIC reason first \u2014 it publishes verbatim'); return;
    }
    apply({action:'new_to_appendix', name:row.name, reason,
           outcome:d.querySelector('.na-outcome').value});
  };
  return d;
}

function renderNewCandidates(){
  const el = document.getElementById('new-candidates');
  el.innerHTML = '';
  const queue = S.new_queue || [], approved = S.new_approved || [];
  if (!queue.length && !approved.length) return;
  const h = document.createElement('div');
  h.className = 'banner';
  h.textContent = `NEW INSTITUTIONS — ${queue.filter(e => e.status === 'ready').length} ready for review · ${queue.filter(e => e.status !== 'ready').length} evidence gaps · ${approved.length} approved locally${S.freeze_active ? ' · blind re-code pending' : ''}`;
  el.appendChild(h);
  queue.forEach(item => el.appendChild(newCandidateCard(item)));
  approved.forEach(item => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="rowhead"><b>${esc(item.row.name)}</b>
      <span class="tag">human approved ${esc(item.row.as_of_reviewed)}</span></div>
      <div class="note">Ready to publish through the human reviewer gate. The later blind re-code will include this approved row.</div>
      <button class="approve new-publish">Publish approved row</button>`;
    d.querySelector('.new-publish').onclick = () =>
      apply({action:'new_publish', name:item.row.name});
    el.appendChild(d);
  });
}

// "Assessed, not classified" gate: drafts staged in local/NOT_CLASSIFIED_QUEUE.json
// (agent/assistant suggestions) are filed to the PUBLIC data/not_classified.json
// only here, on explicit human action. Every field is editable before filing.
function ncCard(entry){
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `
    <div class="rowhead">
      <b>${esc(entry.name)}</b>
      <span class="tag">staged draft — not public until filed</span>
    </div>
    <label>name</label><input type="text" class="n-name" style="width:100%">
    <div class="evrow" style="margin-top:8px">
      <select class="n-type">${TYPES.map(t =>
        `<option ${t===entry.type?'selected':''}>${t}</option>`).join('')}</select>
      <select class="n-region">${REGIONS.map(r =>
        `<option ${r===entry.region?'selected':''}>${r}</option>`).join('')}</select>
      <select class="n-outcome">${OUTCOMES.map(o =>
        `<option ${o===entry.outcome?'selected':''}>${o}</option>`).join('')}</select>
    </div>
    <label>public reason <span class="note">(this text ships on the site — must stand alone, no local/ references)</span></label>
    <textarea class="n-reason" rows="3"></textarea>
    <div class="actions">
      <button class="approve nc-file">File → public appendix (as_of = ${esc(S.today)})</button>
      <button class="pull nc-discard">Discard draft</button>
    </div>`;
  d.querySelector('.n-name').value = entry.name || '';
  d.querySelector('.n-reason').value = entry.reason || '';
  d.querySelector('.nc-file').onclick = () =>
    apply({ action:'nc_file', name: entry.name, fields: {
      name: d.querySelector('.n-name').value.trim(),
      type: d.querySelector('.n-type').value,
      region: d.querySelector('.n-region').value,
      outcome: d.querySelector('.n-outcome').value,
      reason: d.querySelector('.n-reason').value.trim(),
    }});
  d.querySelector('.nc-discard').onclick = () =>
    apply({ action:'nc_discard', name: entry.name });
  return d;
}

function renderNc(){
  const el = document.getElementById('nc');
  el.innerHTML = '';
  const queue = S.nc_queue || [], pub = S.nc_public || [];
  if (!queue.length && !pub.length) return;
  const h = document.createElement('div');
  h.className = 'banner';
  h.textContent = `NOT CLASSIFIED — ${queue.length} staged draft${queue.length===1?'':'s'} awaiting your call · ${pub.length} filed publicly`;
  el.appendChild(h);
  queue.forEach(e => el.appendChild(ncCard(e)));
  if (pub.length){
    const list = document.createElement('div');
    list.innerHTML = `<b class="note">public appendix (data/not_classified.json)</b><ul>${
      pub.map(e => `<li class="note">${esc(e.name)} — ${esc(e.outcome)} — ${esc(e.as_of)}</li>`).join('')}</ul>`;
    el.appendChild(list);
  }
}

async function apply(body){
  const r = await fetch('/apply', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.error) return toast('WRITE FAILED: ' + j.error);
  if (j.approved){
    const row = S.institutions.find(x => x.name === j.approved);
    approvedThisSession.push({ name: j.approved, type: row ? row.type : '?' });
  }
  if (j.pulled) toast(j.nc_staged
    ? `pulled ${j.pulled} → REJECTED.md + staged as withdrawn-on-review in the NOT CLASSIFIED panel below`
    : `pulled ${j.pulled} → logged in local/REJECTED.md`);
  if (j.nc_filed){
    ncFiledThisSession.push(j.nc_filed);
    toast(`${j.nc_filed} filed → data/not_classified.json (public on next build+push)`);
  }
  if (j.nc_discarded) toast(`draft discarded: ${j.nc_discarded}`);
  if (j.ch_approved){
    if (j.transition) transitionsThisSession.push(j.ch_approved);
    const confNote = j.confidence_from && j.confidence_from !== j.confidence_to
      ? ` — confidence ${j.confidence_from} → ${j.confidence_to}` : '';
    toast(j.transition
      ? `${j.ch_approved} moved — transition appended to data/transitions.jsonl${confNote}`
      : `${j.ch_approved} updated, stage unchanged${confNote} — no transition logged`);
  }
  if (j.ch_rejected) toast(`${j.ch_rejected} held as-is — row untouched, reviewed date advanced`);
  if (j.new_approved && !j.new_published) toast(`${j.new_approved} approved locally`);
  if (j.new_rejected) toast(`${j.new_rejected} removed from new-institution queue`);
  if (j.new_ruling) toast(`${j.new_ruling} released to ready — ruling logged`);
  if (j.new_to_appendix) toast(`${j.new_to_appendix} staged for the appendix — file it below`);
  if (j.new_published){
    approvedThisSession.push({name:j.new_published, type:j.type || '?'});
    toast(`${j.new_published} published to institutions.json through the reviewer gate`);
  }
  S = j.state;
  render();
}

function commitHelper(){
  const el = document.getElementById('commit');
  if (!approvedThisSession.length && !ncFiledThisSession.length
      && !transitionsThisSession.length){ el.style.display = 'none'; return; }
  const byType = {};
  approvedThisSession.forEach(a => byType[a.type] = (byType[a.type]||0)+1);
  const parts = Object.entries(byType).map(([t,n]) => `${n} ${t}`).join(', ');
  const bits = [];
  if (approvedThisSession.length) bits.push(`add ${approvedThisSession.length} institutions (${parts})`);
  if (ncFiledThisSession.length) bits.push(`file ${ncFiledThisSession.length} to not-classified appendix`);
  if (transitionsThisSession.length) bits.push(`${transitionsThisSession.length} stage transition${transitionsThisSession.length===1?'':'s'}`);
  const msg = `feat: ${bits.join(' + ')} — human-reviewed`;
  const files = ['data/institutions.json']
    .concat(ncFiledThisSession.length ? ['data/not_classified.json'] : [])
    .concat(transitionsThisSession.length ? ['data/transitions.jsonl'] : []).join(' ');
  const cmd = `git add ${files} && git commit -m "${msg}"`;
  el.style.display = 'block';
  el.innerHTML = `this session: ${approvedThisSession.map(a => esc(a.name))
      .concat(ncFiledThisSession.map(n => esc(n) + ' (appendix)')).join(' · ')}<br><code id="cmd">${esc(cmd)}</code><button id="copycmd">copy</button>
    <span class="note">edit the message freely — batching resets after you commit</span>`;
  document.getElementById('copycmd').onclick = () =>
    navigator.clipboard.writeText(cmd).then(() => {
      approvedThisSession.length = 0; ncFiledThisSession.length = 0;
      transitionsThisSession.length = 0; render(); });
}

function render(){
  const rows = S.institutions;
  // Two states, never both: the freeze is declared and writes are closed, or the
  // corpus has reached the target and nobody has declared it yet. The second is a
  // reminder — nothing trips on its own now that the freeze is a deliberate act.
  const freezeNotice = document.getElementById('freeze-notice');
  freezeNotice.style.display = (S.freeze_active || S.freeze_due) ? 'block' : 'none';
  freezeNotice.textContent = S.freeze_active
    ? 'BLIND RE-CODE PENDING — public approvals are paused until the deliberate recode is complete. Local research may continue; this reviewer remains the only public write path.'
    : S.freeze_due
    ? `${S.n_total} rows — at or past the ${S.freeze_target}-row target, and the freeze is NOT declared. Approvals stay open until you run: python3 tools/review.py --freeze`
    : '';
  // Queue = never-reviewed rows only. A reviewed row is a published measurement
  // and stays out of the queue until a news pass stages a proposal against it
  // (SWEEP PROPOSALS, rendered above). Time alone never re-queues a row: a
  // calendar-driven re-review is rework without new evidence.
  const pending = rows.filter(r => !r.as_of_reviewed)
    .sort((a,b) => (ORDER[a.stage]-ORDER[b.stage]) || a.name.localeCompare(b.name));
  const done = rows.filter(r => r.as_of_reviewed);
  const nProps = (S.changes_queue || []).length;
  const byStage = {};
  pending.forEach(r => byStage[r.stage] = (byStage[r.stage]||0)+1);
  document.getElementById('counts').textContent =
    `${pending.length} new in queue (${STAGES.filter(s=>byStage[s]).map(s=>`${byStage[s]} ${s}`).join(' · ')}) — ${nProps} sweep proposal${nProps===1?'':'s'} — ${done.length} reviewed — ${rows.length} total`;
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  pending.forEach(r => cards.appendChild(card(r)));
  document.getElementById('done').innerHTML = done.length
    ? `<b>reviewed</b><ul>${done.map(r =>
        `<li>${esc(r.name)} — ${esc(r.stage)} — ${esc(r.as_of_reviewed)}</li>`).join('')}</ul>` : '';
  renderChanges();
  renderNewCandidates();
  renderNc();
  commitHelper();
}

fetch('/state').then(r => r.json()).then(j => { S = j; render(); })
  .catch(e => toast('cannot reach review.py: ' + e));
</script>
</body>
